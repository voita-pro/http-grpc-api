syntax = "proto3";

package api.proto;

option go_package = "pkg/pb;pb";

import "protoc-gen-openapiv2/options/annotations.proto";
import "google/protobuf/empty.proto";
import "google/api/annotations.proto";
import "message.proto";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "Voita.PRO template API"
    version: "1.0"
    contact: {
      name: "Development"
      url: "https://github.com/voita-pro/http-grpc-api"
    }
  }
  schemes: HTTP
  consumes: "application/json"
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Authentication token, prefixed by Bearer: Bearer {token}"
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
    }
  }
};

service ServicePB {
  rpc  Login(LoginIN) returns (LoginOUT) {
    option (google.api.http) = {
      post: "/api/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {} // Disable security key
    };
  };
  rpc  Countries(google.protobuf.Empty) returns (CountriesOUT) {
    option (google.api.http) = {
      get: "/api/countries"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
      security: {} // Disable security key
    };
  };
  rpc  CountryAdd(CountryIN) returns (Country){
    option (google.api.http) = {
      post: "/api/country"
      body: "*"
    };
  };
  rpc  CountrySave(Country) returns (Country){
    option (google.api.http) = {
      put: "/api/country/{id}"
      body: "*"
    };
  };
}