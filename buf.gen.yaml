version: v2
clean: true
plugins:
    - local: protoc-gen-go
      include_imports: false
      out: pkg/pb
      opt:
          - paths=source_relative
    - local: protoc-gen-go-grpc
      include_imports: true
      out: pkg/pb
      opt:
          - paths=source_relative
    - local: protoc-gen-grpc-gateway
      out: pkg/pb
      opt:
          - paths=source_relative
          - generate_unbound_methods=true
    - local: protoc-gen-openapiv2
      out: api/openapi